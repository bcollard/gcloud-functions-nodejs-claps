name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Smoke test
        run: yarn test

      # Boot the function the way Cloud Run does (Functions Framework) and
      # check the routes that don't need Firestore.
      - name: Functions Framework boot
        run: |
          run_dir=$(mktemp -d)
          echo '{"web":{"client_id":"ci","client_secret":"ci"}}' > "$run_dir/oauth_client_secret.json"
          (cd "$run_dir" && FIRESTORE_ENV=local FIRESTORE_EMULATOR_HOST=localhost:65535 PROJECT_ID=ci \
            "$GITHUB_WORKSPACE/node_modules/.bin/functions-framework" --source="$GITHUB_WORKSPACE" --target=claps --port=8080 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/claps/secure/auth && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/claps/secure/auth)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/claps)" = 405

  # Deploys master to Cloud Run after the tests pass, as claps-deployer
  # (Workload Identity Federation, no keys). The OAuth client comes from
  # Secret Manager (claps-oauth-client), mounted as a file.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.GCP_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/681025799424/locations/global/workloadIdentityPools/gentinel-github/providers/claps
          service_account: claps-deployer@personal-218506.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy
        run: |
          gcloud run deploy claps \
            --source . \
            --function claps \
            --base-image nodejs22 \
            --region europe-west1 \
            --project personal-218506 \
            --set-secrets /secrets/oauth/oauth_client_secret.json=claps-oauth-client:latest \
            --update-env-vars OAUTH_CLIENT_SECRET_FILE=/secrets/oauth/oauth_client_secret.json \
            --remove-env-vars REDIS_HOST \
            --quiet

      - name: Smoke test through the blog
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://baptistout.net/claps/secure/auth)
            [ "$code" = 302 ] && exit 0
            sleep 6
          done
          echo "::error::https://baptistout.net/claps/secure/auth returned $code"
          exit 1
